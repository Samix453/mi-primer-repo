name: Comprobacion de Java

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Comprobar que compila
        run: javac App.java
